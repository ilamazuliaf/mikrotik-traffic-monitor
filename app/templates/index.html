<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MikroTik Traffic Monitor — Realtime Dashboard</title>
  <meta name="description" content="Aplikasi monitoring trafik realtime dan historis interface MikroTik untuk STB Ubuntu">
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="static/css/style.css">
  
  <!-- Chart.js library -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>

  <div class="dashboard-container">
    
    <!-- Header Navbar -->
    <header class="header-bar">
      <div class="brand-section">
        <div class="brand-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
          </svg>
        </div>
        <div class="brand-title">
          <h1>MIKROTIK TRAFFIC MONITOR</h1>
          <span class="subtitle">Realtime Interface Bandwidth Monitor v1.1.1</span>
        </div>
      </div>

      <div class="status-controls">
        <div class="status-pill online" id="mikrotikStatusPill">
          <span class="dot-indicator"></span>
          <span id="mikrotikStatusText">ONLINE</span>
        </div>

        <div class="last-update-box">
          <span>Last Update:</span>
          <strong id="lastUpdateTime">--:--:--</strong>
        </div>

        <label class="demo-toggle" title="Aktifkan simulasi jika router atau backend tidak terhubung">
          <input type="checkbox" id="demoToggle">
          <span>Simulasi Mode</span>
        </label>
      </div>

      <!-- Live Polling Progress Bar -->
      <div class="polling-progress-bar" id="pollingBar"></div>
    </header>

    <!-- Offline Alert Banner -->
    <div class="banner-offline" id="offlineBanner">
      <div style="display: flex; align-items: center; gap: 0.6rem;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
          <line x1="12" y1="9" x2="12" y2="13"></line>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
        <span class="banner-msg">MIKROTIK OFFLINE - Menunggu koneksi kembali...</span>
      </div>
    </div>

    <!-- Interface Cards Grid (Dynamic rendering via dashboard.js) -->
    <main class="interfaces-grid" id="interfacesGrid">
      <!-- Cards generated dynamically from /api/config -->
    </main>

    <!-- Traffic Graph Section (PRD Section 10-16) -->
    <section class="chart-section">
      <div class="chart-header">
        <div class="chart-title-group">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2">
            <path d="M3 3v18h18"></path>
            <path d="M18.7 8l-5.1 5.2-2.8-2.7L7 14.3"></path>
          </svg>
          <h2>TRAFFIC GRAPH</h2>
          
          <!-- Mode Indicator Badge & Snapshot Info (PRD Section 16) -->
          <div class="mode-badge live" id="graphModeBadge">
            <span class="mode-dot"></span>
            <span id="graphModeText">LIVE</span>
          </div>
          <span class="snapshot-time" id="snapshotTimeText"></span>
        </div>

        <div class="controls-toolbar">
          <!-- Refresh Historical Button (PRD Section 15) -->
          <button class="btn-refresh-historical" id="btnRefreshHistorical" style="display: none;" title="Fetch latest snapshot data">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
            </svg>
            Refresh
          </button>

          <!-- Interface Filter (Dynamic rendering via dashboard.js) -->
          <div class="filter-group filter-interface" id="filterInterfaceGroup"></div>

          <!-- Period Filter (Dynamic rendering via dashboard.js) -->
          <div class="filter-group filter-period" id="filterPeriodGroup"></div>
        </div>
      </div>

      <div class="chart-canvas-container">
        <!-- Chart Loading / Error / Empty Overlay (PRD Section 41, 42, 43) -->
        <div class="chart-overlay" id="chartOverlay" style="display: none;">
          <div class="overlay-spinner" id="overlaySpinner"></div>
          <span id="overlayMessage">Loading data...</span>
        </div>
        <canvas id="trafficChartContainer"></canvas>
      </div>
    </section>

    <!-- Footer Bar -->
    <footer class="footer-info">
      <div>MikroTik Traffic Monitor &copy; 2026 — Designed for Ubuntu STB</div>
      <div>Auto-refresh: <strong id="footerRefreshStatus">5s (Realtime)</strong> | Backend: <strong>FastAPI / SQLite</strong></div>
    </footer>

  </div>

  <!-- Dashboard Script -->
  <script src="static/js/dashboard.js"></script>

</body>
</html>
